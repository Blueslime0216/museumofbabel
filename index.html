<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Every possible picture already hangs here. You only need the address."
    />
    <title>Museum of Babel</title>

    <!-- 링크를 붙였을 때 보이는 카드 (Discord · Slack · 카카오톡 …).
         크롤러는 자바스크립트를 돌리지 않으므로 여기 적힌 것만 읽는다.

         **여기 이미지는 미술관 자체를 가리킨다** (로고). 작품 하나를 가리키는
         `/?a=<주소>` 링크는 이 파일까지 오지 않는다. vercel.json 의 redirects 가
         크롤러 User-Agent 를 `/api/card` 로 돌리고, 그쪽이 `/api/art?a=<주소>` 를
         og:image 로 준다. 사람은 여기로 온다.

         절대 URL 이어야 한다. 호스트를 옮기면 이 두 줄을 고쳐야 한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Museum of Babel" />
    <meta property="og:title" content="Museum of Babel" />
    <meta
      property="og:description"
      content="Every possible picture already hangs here. You only need the address."
    />
    <meta property="og:url" content="https://demo-museumofbabel.vercel.app/" />
    <meta property="og:image" content="https://demo-museumofbabel.vercel.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Museum of Babel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Museum of Babel" />
    <meta
      name="twitter:description"
      content="Every possible picture already hangs here. You only need the address."
    />
    <meta name="twitter:image" content="https://demo-museumofbabel.vercel.app/icon-512.png" />

    <!-- 아이콘.
         favicon.svg   벡터. 16px 에서도 육각형이 읽힌다
         icon-*.png    무늬로 채운 로고. 어두운 벽 위에 얹어 불투명하게 만들었다
                       (iOS 는 apple-touch-icon 의 투명한 자리를 검게 칠한다)
         05_로고 생성기 에서 뽑았다. 주소는 ! - dev/작업노트.md 에 적어 두었다 -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#12100e" />
    <meta name="apple-mobile-web-app-title" content="Babel" />

    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/stage.css" />
    <link rel="stylesheet" href="./src/styles/surface.css" />
    <link rel="stylesheet" href="./src/styles/sheet.css" />
    <link rel="stylesheet" href="./src/styles/modal.css" />
  </head>
  <body>
    <!-- 아래 층: 전시물 격자 -->
    <canvas
      id="stage"
      class="stage"
      role="application"
      tabindex="0"
      data-i18n-label="stage.label"
      aria-label="Museum floor. Drag to move, pinch or scroll to zoom, tap an artwork to inspect it. Arrow keys move to the next artwork."
    ></canvas>

    <!-- 포커스가 옮겨질 때 작품 라벨을 읽어 준다. 캔버스라 이것이 유일한 길이다. -->
    <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>

    <!-- 상시 비네트. 전시장 조명의 느낌이며 개방의 끝점을 자연스럽게 만든다. -->
    <div class="vignette" aria-hidden="true"></div>

    <!-- 위 층: UI. 실제 컨트롤 자리만 입력을 받는다. -->
    <div class="overlay">
      <button
        class="ui pill pill-language"
        id="btn-language"
        data-i18n-label="controls.language"
        aria-label="Language"
      >
        <!-- 번역 아이콘. 글자 하나와 다른 글자 하나. 지구본보다 뜻이 곧바로 읽힌다. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 6.5h7.5M7.25 4.5v2" />
          <path d="M9.5 6.5c0 3.6-2.4 6.6-6 8" />
          <path d="M5 10.5c1.1 1.9 2.9 3.3 5 4" />
          <path d="M12.5 20.5l4-11 4 11" />
          <path d="M13.9 16.9h5.2" />
        </svg>
      </button>

      <!-- 미니맵. 좌상단. 지금 자리를 가운데 둔 지도이며, 누르면 팜플렛이 펼쳐진다.
           캔버스 크기는 화면 배율에 맞춰 js 가 정한다. 여기서 주면 흐릿해진다. -->
      <button
        class="ui minimap"
        id="minimap"
        data-i18n-label="minimap.label"
        aria-label="Map of your surroundings. Press to open the pamphlet."
      >
        <canvas aria-hidden="true"></canvas>
      </button>
      <div class="ui controls" id="controls">
        <button
          class="pill"
          id="btn-search"
          data-i18n-label="controls.search"
          aria-label="Find an artwork"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="M15.5 15.5L21 21" />
          </svg>
        </button>
        <!-- 층. 겹쳐진 판 세 장. 검색과 무작위 사이에 둔다. -->
        <button
          class="pill"
          id="btn-floor"
          data-i18n-label="controls.floor"
          aria-label="Change floor"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l8.5 4.5L12 12 3.5 7.5 12 3z" />
            <path d="M3.5 12L12 16.5 20.5 12" />
            <path d="M3.5 16.5L12 21l8.5-4.5" />
          </svg>
        </button>
        <button
          class="pill"
          id="btn-random"
          data-i18n-label="controls.random"
          aria-label="Go somewhere else"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none" />
            <circle cx="15.5" cy="8.5" r="1.5" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
            <circle cx="8.5" cy="15.5" r="1.5" fill="currentColor" stroke="none" />
            <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>

      <p class="hint" id="hint" data-i18n="stage.hint" aria-hidden="true">drag to explore</p>

      <!-- 시트 (휴대폰) / 플로팅 패널 (PC). 한 코드, 배치만 갈린다. -->
      <section
        class="ui sheet"
        id="sheet"
        data-state="hidden"
        aria-label="Artwork details"
        aria-hidden="true"
      >
        <!-- 손잡이. 끌어서 옮기고, 눌러서 접고 펼친다.
             div 이 아니라 button 인 이유. 누를 수 있는 것이므로 키보드로도
             닿아야 하고 스크린 리더가 역할을 읽어야 한다. -->
        <button
          type="button"
          class="sheet-grip"
          id="sheet-grip"
          aria-controls="sheet-body"
          aria-expanded="false"
          data-i18n-label="sheet.toggle"
          aria-label="Collapse or expand the details"
        >
          <span class="grip-bar"></span>
        </button>

        <button class="sheet-peek" id="sheet-peek">
          <span class="peek-title" id="peek-title">—</span>
          <span class="peek-acc" id="peek-acc">—</span>
        </button>

        <div class="sheet-body" id="sheet-body" aria-hidden="true">
          <div class="plate">
            <canvas id="detail" width="256" height="256" role="img" aria-label="Artwork"></canvas>
          </div>

          <div class="actions">
            <button class="btn" id="btn-copy" data-i18n="sheet.copy">Copy address</button>
            <div class="menu-wrap">
              <button class="btn btn-primary" id="btn-download" aria-expanded="false">
                <span data-i18n="sheet.download">Download</span>
                <svg class="caret" viewBox="0 0 12 12" aria-hidden="true">
                  <path d="M2.5 4.5L6 8l3.5-3.5" />
                </svg>
              </button>
              <div class="menu" id="download-menu" hidden>
                <button class="menu-item" data-size="256">
                  <span data-i18n="sheet.original">Original</span
                  ><span class="menu-note">256 px</span>
                </button>
                <button class="menu-item" data-size="1024">
                  <span data-i18n="sheet.large">Large</span><span class="menu-note">1024 px</span>
                </button>
              </div>
            </div>
          </div>

          <div class="plaque">
            <h2 class="plaque-title" id="plaque-title">—</h2>
            <hr />
            <p data-i18n="sheet.author">Anonymous, undated</p>
            <p id="plaque-medium">—</p>
            <p id="plaque-acc">—</p>
            <p class="plaque-owner" data-i18n="sheet.owner">
              Museum of Babel, permanent collection
            </p>
          </div>

          <section class="field">
            <h3>
              <span data-i18n="sheet.address">Address</span>
              <span class="note" data-i18n="sheet.expand">tap to expand</span>
            </h3>
            <p class="mono address panel" id="address" data-open="0">—</p>
          </section>

          <section class="field">
            <h3><span data-i18n="sheet.record">Record</span></h3>
            <dl class="record panel" id="record"></dl>
          </section>
        </div>
      </section>
    </div>

    <!-- 모달: 찾기 -->
    <div class="scrim" id="scrim-search" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="search-title">
        <h2 class="modal-title" id="search-title" data-i18n="search.title">Find an artwork</h2>

        <!-- 어느 층에서 찾을지. 주소를 붙여넣으면 그 주소의 층이 이긴다. -->
        <div class="segmented" id="search-floors" role="group" aria-labelledby="search-floor-label">
          <span class="segmented-label" id="search-floor-label" data-i18n="search.floor">
            Floor
          </span>
          <div class="segmented-row" id="search-floor-row"></div>
        </div>

        <!--
          어느 전시실에서 찾을지. 기본값은 기준 전시실(1번)이다.
          그 방의 읽는 방식으로 투영하고, 좌표도 그 방 안으로 옮긴다.
          "어디든" 은 두지 않는다 — 방을 강제하지 않으면 좌표가 아무 방에 떨어지고
          그 방이 자기 방식으로 읽어서 올린 그림과 평균 10배 멀어진다(실측).
          이름 대신 번호를 쓴다. 작품 딸림표가 같은 번호를 보여 주므로,
          걸어 다니다 마음에 든 방의 번호를 적어 와서 그 방 안에서 찾을 수 있다.
        -->
        <div class="segmented" id="search-rooms" role="group" aria-labelledby="search-room-label">
          <span class="segmented-label" id="search-room-label" data-i18n="search.room">
            Room
          </span>
          <div class="segmented-row wrap" id="search-room-row"></div>
        </div>
        <!--
          고른 전시실의 이름. 칸에는 번호만 넣는다 — 31칸에 이름을 적으면 칸이
          터지고, 이름이 필요한 순간은 "지금 어느 방을 골랐나" 하나뿐이다.
        -->
        <p class="chosen-room" id="search-room-name"></p>

        <button class="dropzone" id="dropzone" data-busy="0" data-over="0">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4M12 4L7.5 8.5M12 4l4.5 4.5" />
            <path d="M4 15v3.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V15" />
          </svg>
          <span data-i18n="search.upload">Upload a picture</span>
          <small data-i18n="search.uploadNote">we walk to the nearest address</small>
        </button>
        <input type="file" id="search-file" accept="image/*" hidden />

        <div class="compare" id="compare" hidden>
          <figure>
            <canvas id="compare-before" width="256" height="256"></canvas>
            <figcaption data-i18n="search.yours">yours</figcaption>
          </figure>
          <figure>
            <canvas id="compare-after" width="256" height="256"></canvas>
            <figcaption data-i18n="search.nearest">nearest</figcaption>
          </figure>
        </div>

        <div class="or"><span data-i18n="search.or">or</span></div>

        <label class="input-row">
          <input
            type="text"
            id="search-text"
            placeholder="C1a2b3…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <div class="modal-actions">
          <button class="btn" data-close data-i18n="common.cancel">Cancel</button>
          <button class="btn btn-primary" id="btn-go" data-i18n="common.go">Go</button>
        </div>
      </div>
    </div>

    <!-- 모달: 층 -->
    <div class="scrim" id="scrim-floor" hidden>
      <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="floor-title">
        <h2 class="modal-title" id="floor-title" data-i18n="floor.title">Floor</h2>
        <ul class="lang-list" id="floor-list"></ul>
        <p class="modal-note" data-i18n="floor.note">
          a floor is a different grain. you arrive somewhere new.
        </p>
        <div class="modal-actions">
          <button class="btn" data-close data-i18n="common.close">Close</button>
        </div>
      </div>
    </div>

    <!-- 모달: 언어 -->
    <div class="scrim" id="scrim-language" hidden>
      <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="lang-title">
        <h2 class="modal-title" id="lang-title" data-i18n="language.title">Language</h2>
        <ul class="lang-list" id="lang-list"></ul>
        <div class="modal-actions">
          <button class="btn" data-close data-i18n="common.close">Close</button>
        </div>
      </div>
    </div>

    <!-- 커튼: 암전 → 교체 → 원형 개방 -->
    <div id="curtain" class="curtain" aria-hidden="true"></div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <noscript>
      <p class="noscript">
        This museum is drawn in your browser from the address alone. It needs JavaScript.
      </p>
    </noscript>

    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
